services:
  postgres:
    image: postgres:16-alpine
    container_name: primetect-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: primetect
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: change-me-local-only
    ports:
      - "5432:5432"
    volumes:
      - primetect-postgres-data:/var/lib/postgresql/data

volumes:
  primetect-postgres-data:
